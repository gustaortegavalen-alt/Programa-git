<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SmartBuild - Formulario</title>
</head>
<body>
    <h1>Calculadora de Compatibilidad - SmartBuild</h1>
    
    <!-- Formulario usando el método POST -->
    <form action="/" method="post">
        <label for="cpu">Procesador (CPU):</label><br>
        <input type="text" id="cpu" name="cpu" required><br><br>

        <label for="ram">Memoria RAM (GB):</label><br>
        <input type="number" id="ram" name="ram" required><br><br>

        <button type="submit">Enviar datos</button>
    </form>

    {% if resultado %}
        <h3>Resultado:</h3>
        <p>{{ resultado }}</p>
    {% endif %}
</body>
</html>
